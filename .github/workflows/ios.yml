name: ios

# macOS runner minutes cost 10x Linux: run only when `ios/**`, the mac package sources the iOS app links
# (ChirpCore, ChirpSpeakers and their pins) or this file change, not for READMEs. THIRD-PARTY-NOTICES.md stays in:
# ios/scripts/check-project.py reads it.
on:
  pull_request:
    paths: &paths
      - "ios/**"
      - "!ios/README.md"
      - "!ios/Shared/README.md"
      - "mac/Package.swift"
      - "mac/Package.resolved"
      - "mac/Sources/ChirpCore/**"
      - "mac/Sources/ChirpSpeakers/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: |
            ios/DerivedData/SourcePackages
            ios/Shared/.build
            ios/Keyboard/Policy/.build
          key: ios-spm-${{ hashFiles('mac/Package.resolved', 'mac/Package.swift', 'ios/Shared/Package.swift', 'ios/Keyboard/Policy/Package.swift') }}
          restore-keys: ios-spm-
      - run: ./scripts/ci-test.sh
        working-directory: ios
