name: ios

# Not started by pushes or pull requests: macOS runner minutes cost 10x Linux. The gate for `ios/**` and the mac
# sources the app links is `scripts/local-gate.sh` (portable checks and the app's unit tests on a simulator, result
# posted on the tested commit as `local/ios`, see docs/TESTING.md). Start this by hand on a branch when a hosted run
# is wanted: `gh workflow run ios.yml --ref <branch>`.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: |
            ios/DerivedData/SourcePackages
            ios/Shared/.build
            ios/Keyboard/Policy/.build
          key: ios-spm-${{ hashFiles('mac/Package.resolved', 'mac/Package.swift', 'ios/Shared/Package.swift', 'ios/Keyboard/Policy/Package.swift') }}
          restore-keys: ios-spm-
      - run: ./scripts/ci-test.sh
        working-directory: ios
