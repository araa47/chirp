name: desktop-linux

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-linux.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-linux.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev xvfb xauth x11-xkb-utils xdotool xclip python3-gi python3-dbus gir1.2-gtk-3.0 sway wtype wl-clipboard dbus-x11
      - run: npm ci
      - run: npm run check && npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example platform-smoke --example portal-smoke
      - name: X11 native insertion and hotkey smoke
        run: xvfb-run -a env CHIRP_PLATFORM_SMOKE=src-tauri/target/debug/examples/platform-smoke python3 scripts/x11-smoke.py
      - name: Portal binding and failure handling on private D-Bus sessions
        run: |
          dbus-run-session -- env CHIRP_PORTAL_SMOKE=src-tauri/target/debug/examples/portal-smoke python3 scripts/portal-smoke.py
          dbus-run-session -- src-tauri/target/debug/examples/portal-smoke --unavailable
      - name: Native Wayland insertion and clipboard fallback
        run: env CHIRP_PLATFORM_SMOKE=src-tauri/target/debug/examples/platform-smoke scripts/wayland-insertion-smoke.sh
      - run: npm run build -- --bundles deb
      - uses: actions/upload-artifact@v7
        with:
          name: chirp-linux-amd64
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
