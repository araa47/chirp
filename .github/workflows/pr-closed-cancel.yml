# Cancels a pull request's unfinished CI runs when the PR is merged or closed.
#
# `concurrency` only reacts to a newer run in the same group, never to the PR closing, so without this a merged PR's
# queued or running mac, ios, android, desktop and server runs keep a runner busy (macOS minutes cost 10x Linux)
# although the push to main that follows runs the same checks. This job uses no checkout and no secrets, and the token
# is scoped to `actions: write`. Fork PRs are skipped: their token is read-only, and they cannot be cancelled from here.
name: pr-closed-cancel

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the unfinished runs of this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          # A PR reopened right after closing already has fresh runs that must stay.
          state=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
          if [ "$state" != closed ]; then
            echo "PR #$PR is $state again, nothing to cancel."
            exit 0
          fi
          # Every pull_request run of the branch that belongs to this PR and has not finished (queued, waiting or
          # in progress), whatever commit it ran on, except this job's own run.
          runs=$(gh api --method GET --paginate "repos/$REPO/actions/runs" \
            -f event=pull_request -f branch="$BRANCH" -f per_page=100 \
            --jq '.workflow_runs[]
              | select(.status != "completed" and .id != (env.THIS_RUN | tonumber))
              | select(any(.pull_requests[]; .number == (env.PR | tonumber)))
              | "\(.id) \(.name) \(.head_sha[0:8]) \(.status)"')
          if [ -z "$runs" ]; then
            echo "No unfinished runs for PR #$PR."
            exit 0
          fi
          while read -r id name sha status; do
            echo "Cancelling $name ($sha, $status): run $id"
            # A run that finishes in the meantime answers 409; that is fine.
            gh api --method POST "repos/$REPO/actions/runs/$id/cancel" --silent || echo "::warning::could not cancel run $id (already finished?)"
          done <<< "$runs"
