name: android
# throwaway: exercises pr-closed-cancel on a PR into the PR branch, never merged

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      # Same SDK pieces as android/scripts/setup-toolchain.sh, plus the NDK the keyboard module pins.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;28.0.13004108
      - uses: gradle/actions/setup-gradle@v4
      # No keystore secret: the release APK is built unsigned (the build warns and carries on).
      - run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          retention-days: 7
          path: |
            android/app/build/reports/
            android/app/build/test-results/
