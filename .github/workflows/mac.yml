name: mac

# Not started by pushes or pull requests: macOS runner minutes cost 10x Linux. The gate for `mac/**` is
# `scripts/local-gate.sh` (full suite on a Mac, result posted on the tested commit as `local/mac-full`, see
# docs/TESTING.md). Start this by hand on a branch when a hosted run is wanted: `gh workflow run mac.yml --ref <branch>`.
on:
  workflow_dispatch:

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: mac/.build
          key: mac-spm-${{ hashFiles('mac/Package.resolved', 'mac/Package.swift') }}
          restore-keys: mac-spm-
      - run: swift --version
      - run: ./scripts/ci-test.sh
        working-directory: mac
