name: mac

# macOS runner minutes cost 10x Linux: run only when `mac/**` or this file change, not for prose nothing reads (the
# READMEs and mac/docs). Other markdown stays in: tests read mac/Assets/ThirdParty/NOTICES.md.
on:
  pull_request:
    paths: &paths
      - "mac/**"
      - "!mac/README.md"
      - "!mac/docs/**"
      - "!mac/scripts/speaker-bench/README.md"
      - ".github/workflows/mac.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: mac/.build
          key: mac-spm-${{ hashFiles('mac/Package.resolved', 'mac/Package.swift') }}
          restore-keys: mac-spm-
      - run: swift --version
      - run: ./scripts/ci-test.sh
        working-directory: mac
